name: Closeout fold

# The closeout fold, started after each merge. Each closeout note that reached
# main (now-notes/*.md) is folded into NOW.md and deleted by the harness's own
# hook (.claude/hooks/harness-closeout.mjs --fold, checked against its hash
# first), so pull requests never edit NOW.md at once (Ruling, Krish,
# 2026-10-28).
#
# Why a second copy of the fold: the generated `fold` job in
# harness-repository-context.yml (owned by ai-harness's repository
# administration publisher, never edited here) runs only on a push to main,
# and every merge here is made by auto-merge.yml with GitHub's own token. A
# push made with that token starts no workflow, so the fold never ran after a
# merge and the notes waited on main (found 2026-11-14). auto-merge.yml starts
# this workflow after each merge instead, by workflow_dispatch, which is the
# one kind of start that token may make, as control-center's now-cap.yml does.
# The steps below are the generated job's, word for word, and share its
# concurrency group, so the two never fold at once. It also runs by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closeout-fold
  cancel-in-progress: false

jobs:
  fold:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Fold closeout notes into NOW.md
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME" && git reset --quiet --hard "origin/$GITHUB_REF_NAME" || exit 1
            if ! ls now-notes/*.md >/dev/null 2>&1; then echo "No closeout notes to fold."; exit 0; fi
            echo "9d6d1ac460c0d45df9bbc7a10b6cd40badcee45d6fad9ee95d84139726cf8790  .claude/hooks/harness-closeout.mjs" | sha256sum --check --status || { echo "::error::.claude/hooks/harness-closeout.mjs is not the harness copy"; exit 1; }
            status=0; node .claude/hooks/harness-closeout.mjs --fold || status=$?
            if [ -z "$(git status --porcelain -- NOW.md now-notes)" ]; then exit "$status"; fi
            git add -A -- NOW.md now-notes
            git commit --quiet -m "docs(closeout): fold closeout notes into NOW.md" -m "Written by .claude/hooks/harness-closeout.mjs --fold, delivered from krishanraja/ai-harness."
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then exit "$status"; fi
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving; the notes stay in now-notes/ for the next push or the nightly steward."
          exit 1
