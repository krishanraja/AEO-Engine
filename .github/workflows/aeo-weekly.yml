# The weekly research run. Sunday 04:00 UTC reports the week that began the
# previous Monday (week_start is mondayOf(now) in UTC). Three attempts fifteen
# minutes apart, then the failure is preserved so GitHub notifies. Control
# Center dedupes a repeated run_id and replaces an earlier attempt's week, so
# a retry after a partial POST is safe.

name: AEO weekly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject slug or uuid, or all"
        required: false
        default: "all"
        type: string
      dry:
        description: "Validate and write the packets as an artifact; POST nothing"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [aeo-run]

permissions:
  contents: read

concurrency:
  group: aeo-weekly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Resolve the run
        id: plan
        shell: bash
        run: |
          subject="all"
          extra=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            subject="${{ github.event.client_payload.subject || 'all' }}"
            if [ -n "${{ github.event.client_payload.command_id }}" ]; then
              extra="--command-id ${{ github.event.client_payload.command_id }}"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            subject="${{ inputs.subject || 'all' }}"
            if [ "${{ inputs.dry }}" = "true" ]; then extra="--dry --out out/packets.json"; fi
          fi
          echo "args=--subject $subject $extra" >> "$GITHUB_OUTPUT"
          echo "Run: --subject $subject $extra"
      - name: Attempt 1
        id: attempt1
        continue-on-error: true
        env: &aeo_env
          CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
          AEO_ENGINE_SECRET: ${{ secrets.AEO_ENGINE_SECRET }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          AEO_MAX_USD_PER_RUN: ${{ vars.AEO_MAX_USD_PER_RUN }}
        run: npm run --silent run -- ${{ steps.plan.outputs.args }}
      - name: Wait before attempt 2
        if: steps.attempt1.outcome == 'failure'
        run: sleep 900
      - name: Attempt 2
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        env: *aeo_env
        run: npm run --silent run -- ${{ steps.plan.outputs.args }}
      - name: Wait before attempt 3
        if: steps.attempt2.outcome == 'failure'
        run: sleep 900
      - name: Attempt 3
        id: attempt3
        if: steps.attempt2.outcome == 'failure'
        continue-on-error: true
        env: *aeo_env
        run: npm run --silent run -- ${{ steps.plan.outputs.args }}
      - name: Keep the dry-run packets
        if: github.event_name == 'workflow_dispatch' && inputs.dry
        uses: actions/upload-artifact@v4
        with:
          name: aeo-packets
          path: out/
          if-no-files-found: ignore
      - name: Preserve GitHub failure notification
        if: steps.attempt3.outcome == 'failure'
        run: exit 1
