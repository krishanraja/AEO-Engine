# The research run, fortnightly: Sunday 04:00 UTC on odd ISO weeks reports the
# week that began the previous Monday (week_start is mondayOf(now) in UTC).
#
# One job per subject, not one job for all of them. The first live run took
# twenty-six minutes on a single product and was killed by the job timeout
# with four still to go, because a hosted web search takes a minute and no
# amount of tidying inside one job changes that. A subject is independent of
# every other subject: it reads its own context, asks its own questions and
# posts its own packet, so the honest shape is a matrix. A subject that fails
# now fails alone, and the rest of the week still lands.
#
# The spend ceiling stays a ceiling for the whole run: the plan job divides
# AEO_MAX_USD_PER_RUN by the number of subjects and hands each job its share.
#
# Control Center dedupes a repeated run_id and replaces an earlier attempt's
# week, so a retry after a partial POST is safe.
#
# The growth engine protocol (docs/control-center/ENGINE-PROTOCOL.md) rides
# beside the packet ingest, which it does not change: the plan job journals a
# started attempt and reads the directive before the subject list is read,
# each research job leaves a sealed counts-only summary, and the report job
# sends one protocol report, reads it back, reads his decisions and closes the
# attempt. A dry run POSTs nothing, so it reports nothing either. The daily
# directive wake-up is its own workflow (cc-growth-directive.yml) and never
# runs paid research.

name: AEO weekly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject slug or uuid, or all"
        required: false
        default: "all"
        type: string
      dry:
        description: "Validate the packets and print their counts; POST nothing and keep no file (this repository is public)"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [aeo-run]

permissions:
  contents: read

concurrency:
  group: aeo-weekly
  cancel-in-progress: false

jobs:
  # Which subjects are in this run, and what each may spend. One cheap call to
  # Control Center, which is the only place the subject list lives.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      subjects: ${{ steps.subjects.outputs.list || '[]' }}
      cap: ${{ steps.subjects.outputs.cap }}
      total: ${{ steps.subjects.outputs.total }}
      dry: ${{ steps.guard.outputs.dry }}
      command_id: ${{ steps.guard.outputs.command_id }}
      skip: ${{ steps.guard.outputs.skip }}
      protocol: ${{ steps.guard.outputs.protocol }}
      scope: ${{ steps.guard.outputs.scope }}
      run_id: ${{ steps.guard.outputs.run_id }}
      attempt_id: ${{ steps.guard.outputs.attempt_id }}
      started_at: ${{ steps.guard.outputs.started_at }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the trigger
        id: guard
        shell: bash
        env:
          # Through the environment, never interpolated into the script: a
          # dispatch payload is data, and data that becomes shell is a way in.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SUBJECT: ${{ github.event.client_payload.subject }}
          DISPATCH_COMMAND_ID: ${{ github.event.client_payload.command_id }}
          INPUT_SUBJECT: ${{ inputs.subject }}
          INPUT_DRY: ${{ inputs.dry }}
        run: |
          set -euo pipefail
          asked="all"
          command_id=""
          dry="false"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            asked="${DISPATCH_SUBJECT:-all}"
            command_id="${DISPATCH_COMMAND_ID:-}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            asked="${INPUT_SUBJECT:-all}"
            dry="${INPUT_DRY:-false}"
          fi
          # A slug or a uuid and nothing else. Anything stranger is refused
          # rather than passed on to a shell or a URL.
          if ! printf '%s' "$asked" | grep -Eq '^[A-Za-z0-9_-]{1,64}$'; then
            echo "refusing subject: $asked" >&2
            exit 1
          fi
          if [ -n "$command_id" ] && ! printf '%s' "$command_id" | grep -Eq '^[0-9]{1,12}$'; then
            echo "refusing command id" >&2
            exit 1
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "asked=$asked" >> "$GITHUB_OUTPUT"

          # Fortnightly (Krish, 2026-10-15: "happy with the fortnightly AI
          # visiblity check"): the Sunday schedule runs on odd ISO weeks only
          # (week 41 ran on 11 October, so the next is week 43, 25 October).
          # A dispatch from Control Center or the Actions button always runs.
          week=$(date -u +%V)
          if [ "$EVENT_NAME" = "schedule" ] && [ $((10#$week % 2)) -eq 0 ]; then
            echo "ISO week $week is an off week; the research runs fortnightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "protocol=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # The protocol ids. One full run a day has a run_id the daily
          # directive can find; a single-subject run is told apart by the
          # workflow run. The attempt is this try of this workflow run.
          run_date=$(date -u +%F)
          if [ "$asked" = "all" ]; then scope="all"; run_id="aeo:$run_date:research"; else scope="one"; run_id="aeo:$run_date:research:$GITHUB_RUN_ID"; fi
          if [ "$dry" = "true" ]; then echo "protocol=false" >> "$GITHUB_OUTPUT"; else echo "protocol=true" >> "$GITHUB_OUTPUT"; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt_id=aeo:$run_date:research:$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: ${{ steps.guard.outputs.protocol == 'true' }}
        with:
          node-version: '20'
          cache: 'npm'
      - if: ${{ steps.guard.outputs.protocol == 'true' }}
        run: npm ci
      # Before the subject list is read, as the protocol asks. A protocol
      # failure here is logged and does not stop the research: the packets
      # are the fortnight's work, and the report job says what went wrong.
      - name: Journal the attempt and read the directive
        if: ${{ steps.guard.outputs.protocol == 'true' }}
        continue-on-error: true
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          ATTEMPT_ID: ${{ steps.guard.outputs.attempt_id }}
          RUN_ID: ${{ steps.guard.outputs.run_id }}
          STARTED_AT: ${{ steps.guard.outputs.started_at }}
        run: npm run --silent protocol -- research-start --attempt-id "$ATTEMPT_ID" --run-id "$RUN_ID" --started-at "$STARTED_AT"

      - name: Resolve the subjects and the per-subject cap
        id: subjects
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        env:
          CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
          AEO_ENGINE_SECRET: ${{ secrets.AEO_ENGINE_SECRET }}
          AEO_MAX_USD_PER_RUN: ${{ vars.AEO_MAX_USD_PER_RUN }}
          ASKED: ${{ steps.guard.outputs.asked }}
        run: |
          set -euo pipefail
          asked="$ASKED"
          if [ "$asked" != "all" ]; then
            list="[\"$asked\"]"
            count=1
          else
            body=$(curl -sS --max-time 60 -H "Authorization: Bearer $AEO_ENGINE_SECRET" "$CONTROL_CENTER_URL/api/aeo/context?subject=all")
            list=$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const v=(j.subjects||[]).map(x=>x.slug);if(!v.length){console.error("no active subjects");process.exit(1)}process.stdout.write(JSON.stringify(v))})')
            count=$(printf '%s' "$list" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')
          fi
          total="${AEO_MAX_USD_PER_RUN:-25}"
          cap=$(node -e "process.stdout.write((Number(process.argv[1])/Number(process.argv[2])).toFixed(2))" "$total" "$count")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "cap=$cap" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Subjects: $list ($count), $cap USD each of $total"

  research:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # One subject measured at 26 minutes on the first live run. An attempt, a
    # wait and a retry is about 57, so the hour the single-job version had
    # would have killed the retry rather than the work.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Three at a time: enough to finish inside the hour, gentle enough that
      # the assistants are not asked fifteen questions at once.
      max-parallel: 3
      matrix:
        subject: ${{ fromJson(needs.plan.outputs.subjects) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Two attempts in the one step, five minutes apart. GitHub Actions
      # rejects YAML anchors, so a second step would mean naming eight
      # secrets twice; a loop names them once and still ends in exit 1, which
      # is what sends the failure email.
      - name: Research this subject
        env:
          CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
          AEO_ENGINE_SECRET: ${{ secrets.AEO_ENGINE_SECRET }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SUBJECT: ${{ matrix.subject }}
          CAP: ${{ needs.plan.outputs.cap }}
          COMMAND_ID: ${{ needs.plan.outputs.command_id }}
          DRY: ${{ needs.plan.outputs.dry }}
          PROTOCOL: ${{ needs.plan.outputs.protocol }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          set -uo pipefail
          args=(--subject "$SUBJECT" --cap-usd "$CAP")
          if [ -n "$COMMAND_ID" ]; then args+=(--command-id "$COMMAND_ID"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry --out "out/packet.$SUBJECT.json"); fi
          # Counts only, sealed to this workflow run (src/lib/seal.ts), named
          # by job index so no subject reaches an artifact name.
          if [ "$PROTOCOL" = "true" ]; then args+=(--summary-out "summary/summary-$JOB_INDEX.json"); fi
          for attempt in 1 2; do
            echo "::group::$SUBJECT attempt $attempt"
            npm run --silent run -- "${args[@]}" && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            if [ "$attempt" = "1" ]; then
              echo "$SUBJECT failed, waiting five minutes before the retry"
              sleep 300
            fi
          done
          echo "$SUBJECT failed twice"
          exit 1
      # A dry run keeps no packet. A packet holds call themes from his
      # Fireflies transcripts and prospect approach hooks, and this
      # repository's artifacts are public, so the packet stays on the runner
      # and the log carries only the counts the CLI prints. To read a whole
      # packet, run --dry --out on his own machine (README).
      # This repository is public, and so are its artifacts. The summary is
      # sealed and holds counts only; it lives one day.
      - name: Keep the sealed summary for the report job
        if: ${{ always() && needs.plan.outputs.protocol == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aeo-summary-${{ strategy.job-index }}
          path: summary/
          retention-days: 1
          if-no-files-found: ignore

  # One protocol report for the whole run, after every subject: the objective
  # from the packets, one line per subject, and a spend ask only when the cap
  # stopped probes. Then the readback, his decisions and the terminal attempt.
  # It runs when the plan journaled a started attempt, whatever the research
  # did, so a started attempt never hangs open.
  report:
    needs: [plan, research]
    if: ${{ always() && needs.plan.outputs.protocol == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: aeo-summary-*
          path: summaries
          merge-multiple: true
      - name: Report to Control Center
        env:
          CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
          CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
          AEO_ENGINE_SECRET: ${{ secrets.AEO_ENGINE_SECRET }}
          ATTEMPT_ID: ${{ needs.plan.outputs.attempt_id }}
          RUN_ID: ${{ needs.plan.outputs.run_id }}
          STARTED_AT: ${{ needs.plan.outputs.started_at }}
          SUBJECTS: ${{ needs.plan.outputs.subjects }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          TOTAL: ${{ needs.plan.outputs.total || vars.AEO_MAX_USD_PER_RUN || '25' }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -uo pipefail
          args=(research-report --attempt-id "$ATTEMPT_ID" --run-id "$RUN_ID" --started-at "$STARTED_AT" --subjects "${SUBJECTS:-[]}" --scope "$SCOPE" --total-cap-usd "$TOTAL" --summaries summaries)
          if [ "$PLAN_RESULT" != "success" ]; then args+=(--plan-error context_unavailable); fi
          npm run --silent protocol -- "${args[@]}"
