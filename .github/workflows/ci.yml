name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # No network in tests: every client has an offline twin that reads
      # tests/fixtures, and the CLI test runs the whole pipeline against them.
      - run: npm test
      - run: npm run check:config
